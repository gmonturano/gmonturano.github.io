  <meta charset="utf-8">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
.dissemination-hero {
      margin-bottom: 18px;
    }
    .dissemination-grid {
      display: grid;
      grid-template-columns:minmax(0, 1fr) 390px;
      gap: 18px;
      align-items: start;
    }
    #map {
      height:760px;
      border: 1px solid var(--rule);
      background: #f5f5f5;
    }
    .map-panel {
      border: 1px solid var(--rule);
      background: #fafafa;
      padding: 12px;
    }
    .filters {
      display: grid;
      gap: 9px;
      margin-bottom: 12px;
    }
    .filters label {
      font-size: .82rem;
      font-weight: 700;
      color: #111;
    }
    .filters select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--rule);
      background: white;
      font: inherit;
      font-size: .9rem;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
      font-size: .82rem;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      display: inline-block;
    }
    .dot.int { background: #b00020; }
    .dot.nat { background: #0057d9; }
    .dot.work { background: #d97706; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--rule);
      background: white;
      padding: 9px;
      text-align: center;
    }
    .stat strong {
      display: block;
      font-size: 1.25rem;
      color: #111;
    }
    .stat span {
      font-size: .78rem;
      color: var(--muted);
    }
    .event-list {
      max-height: 390px;
      overflow: auto;
      border-top: 1px solid var(--rule);
      padding-top: 8px;
    }
    .event-card {
      padding: 9px 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
    }
    .event-card:hover .event-title {
      text-decoration: underline;
    }
    .event-meta {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      font-weight: 700;
    }
    .event-title {
      font-weight: 700;
      color: #111;
      margin-top: 2px;
    }
    .event-paper {
      font-size: .86rem;
      margin-top: 3px;
    }
    .popup-title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .popup-paper {
      font-size: .9rem;
    }
    @media (max-width: 900px) {
      .dissemination-grid {
        grid-template-columns: 1fr;
      }
      #map {
        height: 520px;
      }
    }
  </style>
</head>

<main class="wrap page dissemination-page">

          <option value="Workshop / invited seminar">Workshop / invited seminar</option>

      <div class="legend">

        <span class="legend-item"><span class="dot nat"></span> National</span>
        <span class="legend-item"><span class="dot work"></span> Workshop / seminar</span>

  </div>

f the Italian Citizenship Income on Tackling Poverty and Inequalities"}, {"year": 2024, "type": "National conference", "city": "Enna", "country": "Italy", "lat": 37.5675, "lon": 14.279, "venue": "University of Enna Kore", "title": "21st Annual CiMET Workshop", "paper": "Assessing the Effectiveness of the Italian Citizenship Income on Tackling Poverty and Inequalities"}, {"year": 2024, "type": "National conference", "city": "Turin", "country": "Italy", "lat": 45.0703, "lon": 7.6869, "venue": "University of Turin", "title": "XLV Annual Scientific Conference AISRe", "paper": "Income Support Policies and Voting Behavior in a Dual Country. Evidence from Italy"}, {"year": 2024, "type": "National conference", "city": "Rome", "country": "Italy", "lat": 41.9028, "lon": 12.4964, "venue": "Sapienza University of Rome", "title": "Workshop on Inequality and Intergenerational Mobility", "paper": "Exploiting COVID-19 Data to Identify Fragile Areas in Italy Using Geographically-Informed Clustering"}, {"year": 2024, "type": "National conference", "city": "Perugia", "country": "Italy", "lat": 43.1107, "lon": 12.3908, "venue": "University of Perugia", "title": "11th Federico Caffè Working Group Meeting", "paper": "Assessing the Effectiveness of the Italian Citizenship Income on Tackling Poverty and Inequalities"}, {"year": 2023, "type": "National conference", "city": "Taormina", "country": "Italy", "lat": 37.8516, "lon": 15.2853, "venue": "University of Messina / Taormina", "title": "XV SISTUR Scientific Meeting", "paper": "Impacts of Cohesion Funds on Local Tourism. Counterfactual Analysis and Machine Learning Approaches"}, {"year": 2023, "type": "National conference", "city": "L'Aquila", "country": "Italy", "lat": 42.3498, "lon": 13.3995, "venue": "Gran Sasso Science Institute", "title": "64th Annual Scientific Meeting of the Italian Economic Association", "paper": "Which Kind of Occupational Profiles Are More Likely to Evade? Evidence from Italian Provinces"}, {"year": 2023, "type": "National conference", "city": "Naples", "country": "Italy", "lat": 40.8518, "lon": 14.2681, "venue": "University of Naples Parthenope", "title": "XLIV Annual Scientific Conference AISRe", "paper": "Which Kind of Occupational Profiles Are More Likely to Evade? Evidence from Italian Provinces"}, {"year": 2023, "type": "National conference", "city": "Milan", "country": "Italy", "lat": 45.4642, "lon": 9.19, "venue": "University of Milano-Bicocca", "title": "1st Italian Conference on Economic Statistics", "paper": "Which Kind of Occupational Profiles Are More Likely to Evade? Evidence from Italian Provinces"}, {"year": 2022, "type": "National conference", "city": "Teramo", "country": "Italy", "lat": 42.6612, "lon": 13.699, "venue": "University of Teramo", "title": "Conference of the Faculty of Communication Sciences", "paper": "Comunicare e Percepire le Politiche Economiche e Fiscali"}, {"year": 2026, "type": "Workshop / invited seminar", "city": "Foggia", "country": "Italy", "lat": 41.4622, "lon": 15.5446, "venue": "University of Foggia", "title": "Scientific Workshop on Territorial Transition", "paper": "Predicting Delays in Cohesion Infrastructure Projects"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Bari", "country": "Italy", "lat": 41.1171, "lon": 16.8719, "venue": "University of Bari Aldo Moro", "title": "3rd Plenary Meeting on Territorial Sustainability", "paper": "Results within the GRINS Spoke 7 project"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Venice", "country": "Italy", "lat": 45.4408, "lon": 12.3155, "venue": "Ca’ Foscari University of Venice", "title": "3rd Workshop on Sustainable Finance: Innovation, ESG and Digital Finance", "paper": "Socio-Economic Drivers of Accessibility: Prediction with Network and Machine-Learning Framework"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Naples", "country": "Italy", "lat": 40.8518, "lon": 14.2681, "venue": "ISTAT / University of Campania", "title": "How can AI, digitalisation, and greening ensure smart and sustainable growth?", "paper": "Machine Learning and Causal inference for economics"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Bari", "country": "Italy", "lat": 41.1171, "lon": 16.8719, "venue": "University of Bari Aldo Moro", "title": "Regional Studies and Territorial Development", "paper": "Analyzing Accessibility to Citizenship Services: A Network Analysis and Machine Learning Approach"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Castel del Giudice", "country": "Italy", "lat": 41.8547, "lon": 14.2324, "venue": "GRINS Spoke 7", "title": "Multidisciplinary Territorial Policy Lab", "paper": "L’accessibilità ai servizi di cittadinanza: un’analisi a livello comunale"}, {"year": 2025, "type": "Workshop / invited seminar", "city": "Bari", "country": "Italy", "lat": 41.1171, "lon": 16.8719, "venue": "University of Bari Aldo Moro", "title": "2nd Meeting on Territorial Sustainability", "paper": "Digital vulnerability and gap analysis; Health access and public transport"}, {"year": 2024, "type": "Workshop / invited seminar", "city": "Naples", "country": "Italy", "lat": 40.8518, "lon": 14.2681, "venue": "ISTAT / University of Naples Parthenope", "title": "How can AI, digitalisation, and greening ensure smart and sustainable growth?", "paper": "Analyzing Accessibility to Citizenship Services: A Network Analysis and Machine Learning Approach"}, {"year": 2023, "type": "Workshop / invited seminar", "city": "Rome", "country": "Italy", "lat": 41.9028, "lon": 12.4964, "venue": "Roma Tre University", "title": "Summer School in Economic policy and welfare in a context of high inflation", "paper": "The Impact of Italy’s Strategy for Inner Areas on Depopulation and Industrial Growth"}, {"year": 2023, "type": "Workshop / invited seminar", "city": "Modena", "country": "Italy", "lat": 44.6471, "lon": 10.9252, "venue": "University of Modena and Reggio Emilia", "title": "PhD Candidate Seminar", "paper": "The short-run effects of Place-based policies"}, {"year": 2022, "type": "Workshop / invited seminar", "city": "Modena", "country": "Italy", "lat": 44.6471, "lon": 10.9252, "venue": "University of Modena and Reggio Emilia", "title": "A multi-criteria approach to social indicators", "paper": "Local public spending on sustainability in NSIA areas"}];

const colors = {
  "International conference": "#b00020",
  "National conference": "#0057d9",
  "Workshop / invited seminar": "#d97706"
};

const map = L.map("map", { scrollWheelZoom: false }).setView([43.7, 11.5], 4);

/* Satellite basemap */
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics"
  }
).addTo(map);

/* Place labels above satellite imagery */
L.tileLayer(
  "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Labels &copy; Esri"
  }
).addTo(map);

let markers = [];

function markerIcon(type) {
  const color = colors[type] || "#111";
  return L.divIcon({
    className: "custom-marker",
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 0 1px rgba(0,0,0,.25);"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[s]));
}

function render() {
  const year = document.getElementById("yearFilter").value;
  const type = document.getElementById("typeFilter").value;

  const filtered = events.filter(e =>
    (year === "all" || String(e.year) === year) &&
    (type === "all" || e.type === type)
  );

  clearMarkers();

  const bounds = [];
  filtered.forEach((e, idx) => {
    const marker = L.marker([e.lat, e.lon], { icon: markerIcon(e.type) })
      .bindPopup(`
        <div class="popup-title">${escapeHtml(e.title)}</div>
        <div>${escapeHtml(e.city)}, ${escapeHtml(e.country)} · ${e.year}</div>
        <div><em>${escapeHtml(e.type)}</em></div>
        <div class="popup-paper"><strong>Paper:</strong> ${escapeHtml(e.paper)}</div>
      `)
      .addTo(map);
    marker._eventIndex = idx;
    markers.push(marker);
    bounds.push([e.lat, e.lon]);
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 6 });
  }

  document.getElementById("totalCount").textContent = filtered.length;
  document.getElementById("cityCount").textContent = new Set(filtered.map(e => e.city)).size;
  document.getElementById("countryCount").textContent = new Set(filtered.map(e => e.country)).size;

  const list = document.getElementById("eventList");
  list.innerHTML = filtered.map((e, i) => `
    <div class="event-card" data-i="${i}">
      <div class="event-meta">${e.year} · ${escapeHtml(e.type)} · ${escapeHtml(e.city)}, ${escapeHtml(e.country)}</div>
      <div class="event-title">${escapeHtml(e.title)}</div>
      <div class="event-paper">${escapeHtml(e.paper)}</div>
    </div>
  `).join("");

  document.querySelectorAll(".event-card").forEach(card => {
    card.addEventListener("click", () => {
      const i = Number(card.dataset.i);
      const e = filtered[i];
      map.setView([e.lat, e.lon], 7);
      markers[i].openPopup();
    });
  });
}

document.getElementById("yearFilter").addEventListener("change", render);
document.getElementById("typeFilter").addEventListener("change", render);

render();
</script>
